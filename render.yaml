services:
  - type: web
    name: yamamotoavator-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_VOICE_ID
        sync: false
      - key: LIVEAVATAR_LANGUAGE
        value: ja
      - key: LIVEAVATAR_MODE
        value: FULL
      - key: LIVEAVATAR_USE_SANDBOX
        value: "true"
      - key: LIVEAVATAR_VIDEO_QUALITY
        value: medium
      - key: LIVEAVATAR_VIDEO_ENCODING
        value: H264
      - key: LIVEAVATAR_SELF_CONTROLLED
        value: "true"
      - key: LIVEAVATAR_ASSISTANT_NAME
        value: 山本
      - key: LIVEAVATAR_ASSISTANT_PERSONA
        value: 肺がん専門の内科医
      - key: LIVEAVATAR_OPENING_GREETING
        value: 内科医の山本です。今日はどうされましたか？
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: RAG_LLM_TRANSCRIPT_NORMALIZATION_ENABLED
        value: "true"
      - key: RAG_LLM_TRANSCRIPT_NORMALIZATION_MODEL
        value: gpt-4.1-mini
      - key: RAG_TOP_K
        value: "6"
      - key: RAG_DATA_PATH
        value: ./data/processed/lung-cancer-guideline-hybrid.jsonl
      - key: RAG_ENDPOINT_API_KEY
        sync: false
