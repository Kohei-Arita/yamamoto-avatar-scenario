services:
  - type: web
    name: yamamoto-avatar-scenario
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_VOICE_ID
        sync: false
      - key: LIVEAVATAR_LANGUAGE
        value: ja
      - key: LIVEAVATAR_MODE
        value: FULL
      - key: LIVEAVATAR_USE_SANDBOX
        value: "false"
      - key: LIVEAVATAR_VIDEO_QUALITY
        value: medium
      - key: LIVEAVATAR_VIDEO_ENCODING
        value: H264
      - key: LIVEAVATAR_SELF_CONTROLLED
        value: "true"
      - key: LIVEAVATAR_ASSISTANT_NAME
        value: 山本
      - key: LIVEAVATAR_ASSISTANT_PERSONA
        value: 肺がん専門の内科医
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SCENARIO_ID
        value: haigan-2026
      - key: SCENARIO_DIR
        value: ./data/scenarios
      - key: SCENARIO_SPEECH_MODE
        value: fixed
      - key: SCENARIO_INTENT_LLM
        value: "true"
      - key: OPERATOR_TOKEN
        sync: false
      - key: DIALOGUE_LLM_TRANSCRIPT_NORMALIZATION_ENABLED
        value: "false"
